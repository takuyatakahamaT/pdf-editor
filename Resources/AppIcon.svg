<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- PDF editor のアプリアイコン（NIHO の配色・生成りの角丸タイル）。scripts/build-app-icon.sh で AppIcon.png と AppIcon.icns を作る -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFCF9"/>
      <stop offset="1" stop-color="#F1EDE6"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2E2A24" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- タイル -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#tile-shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="3"/>

