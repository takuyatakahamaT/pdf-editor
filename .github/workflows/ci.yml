name: macOS acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: macos-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Package Go version
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Install Poppler tools for redaction verification
        run: brew list --versions poppler >/dev/null 2>&1 || brew install poppler
      - name: Test PDF link remapper
        run: go -C Tools/pdf-link-remap test ./...
      - name: Build PDF link remapper
        run: go -C Tools/pdf-link-remap build -trimpath -o "$RUNNER_TEMP/pdf-link-remap" .
      - name: Package and verify the app (no release keys)
        run: PDF_EDITOR_APP_BUNDLE="$RUNNER_TEMP/PDF editor.app" scripts/build-app.sh
        env:
          GOTOOLCHAIN: auto
      - name: Acceptance tests
        run: swift test --no-parallel
        env:
          PDF_EDITOR_LINK_REMAP_HELPER: ${{ runner.temp }}/pdf-link-remap
          PDFIUM_LIBRARY_PATH: ${{ runner.temp }}/PDF editor.app/Contents/Frameworks/libpdfium.dylib
      - name: Update security acceptance (no private keys)
        run: python3 scripts/check-update-security.py
