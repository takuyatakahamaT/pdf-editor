name: Swift CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Poppler tools for redaction verification
        run: brew list --versions poppler >/dev/null 2>&1 || brew install poppler
      - name: Build release app
        run: swift build -c release
      - name: Run tests
        run: swift test
