name: Signed macOS release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-macos-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && vars.PDF_EDITOR_RELEASES_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 35
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Test PDF link remapper
        run: go -C Tools/pdf-link-remap test ./...
      - name: Build PDF link remapper
        run: go -C Tools/pdf-link-remap build -trimpath -o "$RUNNER_TEMP/pdf-link-remap" .
      - name: Release build and acceptance tests
        run: |
          swift build -c release
          PDF_EDITOR_LINK_REMAP_HELPER="$RUNNER_TEMP/pdf-link-remap" swift test
          python3 scripts/check-update-security.py
      - name: Build, notarize, sign updates, and publish
        run: scripts/publish-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          PDF_EDITOR_CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
