name: Sparkle署名付き更新
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-macos-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && vars.PDF_EDITOR_RELEASES_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 35
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Release build and acceptance tests
        run: |
          swift build -c release
          swift test
          python3 scripts/check-update-security.py
      - name: Build, sign updates, and publish
        run: scripts/publish-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
